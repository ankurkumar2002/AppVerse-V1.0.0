spring.application.name=app-service
spring.data.mongodb.uri=mongodb://localhost:27017/app-service
server.port=8080

server.error.include-stacktrace=always
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/appverse

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.mongodb.driver=DEBUG
logging.level.com.appverse.app_service.config.SecurityConfig=DEBUG

# logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.com.appverse=DEBUG

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ... other app-service properties ...

feign.client.subscription-service.url=http://localhost:8086

springdoc.swagger-ui.path=/swagger-ui.html
# feign.circuitbreaker.enabled=true


# Enable circuit breaker
resilience4j.circuitbreaker.instances.developerClient.register-health-indicator=true
resilience4j.circuitbreaker.instances.developerClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.developerClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.developerClient.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.subscriptionServiceClient.register-health-indicator=true
resilience4j.circuitbreaker.instances.subscriptionServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.subscriptionServiceClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.subscriptionServiceClient.minimum-number-of-calls=5

management.endpoints.web.exposure.include=*

logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.circuitbreaker=DEBUG

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=app-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# management.endpoints.web.exposure.include=health, info, metrics, prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# management.observations.key-values.application=app-service

management.tracing.sampling.probability=1.0

management.observations.key-values.application=${spring.application.name}

app.upload-dir=C:/Users/ankur/Documents/AppVerse - V1.0.0/app-service/uploads/