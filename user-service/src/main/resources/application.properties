# ===============================
# Application
# ===============================
spring.application.name=user-service
server.port=8082

# ===============================
# Database (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3308/user_service
spring.datasource.username=root
spring.datasource.password=ankur

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.flush_before_completion=true
spring.jpa.properties.hibernate.jdbc.batch_size=5
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Security (Resource Server - Keycloak)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/appverse

# ===============================
# Feign Client
# ===============================
services.identity-service.url=http://localhost:8085

# ===============================
# Keycloak Admin (ONLY if still injected)
# ===============================
keycloak.token-uri=http://localhost:8181/realms/appverse/protocol/openid-connect/token
# appverse.keycloak.server-url=http://localhost:8181
appverse.keycloak.realm=appverse
appverse.keycloak.client-id=user-service
appverse.keycloak.client-secret=m6D8qup5Kz89gRHvzRyDXdvnGxJFJTdR

# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.template.default-topic=user-events

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.appverse=DEBUG

# ===============================
# Actuator / Observability
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# ===============================
# Prometheus
# ===============================
management.metrics.export.prometheus.enabled=true

