# Use in-memory DB for repository tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Disable OAuth resource server auto config requirement
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://dummy

# Prevent feign from trying to resolve URLs
appverse.application-service.url=http://localhost