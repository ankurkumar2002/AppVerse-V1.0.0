<div class="profile-update-container">
  <h2>Update Developer Profile</h2>

  <form [formGroup]="developerForm" (ngSubmit)="updateDeveloperProfile()">
    <div class="form-grid">
      <div class="form-group">
        <label for="name">Display Name</label>
        <input id="name" type="text" formControlName="name" pInputText />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" pInputText />
      </div>

      <div class="form-group">
        <label for="developerType">Developer Type</label>
        <p-dropdown
          [options]="developerTypes"
          formControlName="developerType"
          optionLabel="label"
          optionValue="value"
          placeholder="Select Type"
        ></p-dropdown>
      </div>

      <div class="form-group">
        <label for="website">Website</label>
        <input id="website" type="text" formControlName="website" pInputText />
      </div>

      <div class="form-group">
        <label for="companyName">Company Name</label>
        <input id="companyName" type="text" formControlName="companyName" pInputText />
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input id="location" type="text" formControlName="location" pInputText />
      </div>

      <div class="form-group full-width">
        <label for="bio">Bio</label>
        <textarea id="bio" formControlName="bio" pInputTextarea rows="5"></textarea>
      </div>

      <div class="form-group full-width">
        <label for="logoUrl">Logo URL</label>
        <input id="logoUrl" type="text" formControlName="logoUrl" pInputText />
      </div>
    </div>

    <button
      pButton
      type="submit"
      label="Update Profile"
      [disabled]="developerForm.invalid || loading"
    ></button>
  </form>
</div>
