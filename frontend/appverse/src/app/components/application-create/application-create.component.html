<form [formGroup]="applicationForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Tagline</mat-label>
    <input matInput formControlName="tagline" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="description"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Version</mat-label>
    <input matInput formControlName="version" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Category</mat-label>
    <mat-select formControlName="categoryId">
      <mat-option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Monetization Type</mat-label>
    <mat-select formControlName="monetizationType">
      <mat-option *ngFor="let type of monetizationTypes" [value]="type">{{ type }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Price</mat-label>
    <input matInput type="number" formControlName="price" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Currency</mat-label>
    <mat-select formControlName="currency">
      <mat-option *ngFor="let c of currencies" [value]="c">{{ c }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Billing Interval</mat-label>
    <mat-select formControlName="billingInterval">
      <mat-option *ngFor="let i of billingIntervals" [value]="i">{{ i }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Billing Interval Count</mat-label>
    <input matInput type="number" formControlName="billingIntervalCount" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Trial Period Days</mat-label>
    <input matInput type="number" formControlName="trialPeriodDays" />
  </mat-form-field>

  <br />

  <!-- Thumbnail -->
  <label>Thumbnail:</label>
  <input type="file" (change)="onThumbnailSelected($event)" />

  <!-- Screenshots -->
  <label>Screenshots:</label>
  <input type="file" multiple (change)="onScreenshotsSelected($event)" />

  <div *ngFor="let file of screenshotFiles; let i = index">
    <p><strong>Screenshot {{ i + 1 }}:</strong> {{ file.name }}</p>

    <mat-form-field>
      <mat-label>Caption</mat-label>
      <input matInput [(ngModel)]="screenshotMetadata[i].caption" name="caption{{ i }}" [ngModelOptions]="{standalone: true}" />

    </mat-form-field>

    <mat-form-field>
      <mat-label>Order</mat-label>
      <input matInput type="number" [(ngModel)]="screenshotMetadata[i].order" name="order{{ i }}" [ngModelOptions]="{standalone: true}" />

    </mat-form-field>
  </div>

  <br />

  <button mat-raised-button color="primary" type="submit" [disabled]="applicationForm.invalid">
    Create Application
  </button>

  <button mat-button type="button" (click)="onCancel()">Cancel</button>
</form>
