<mat-toolbar color="primary" class="toolbar">
  <span class="logo">AppVerse</span>
  <span class="spacer"></span>

  <!-- Theme Toggle -->
  <button mat-icon-button (click)="toggleTheme()" aria-label="Toggle theme">
    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <!-- User Menu -->
  <button mat-button [matMenuTriggerFor]="userMenu">User</button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="login('user')">Login</button>
    <button mat-menu-item (click)="register('user')">Register</button>
  </mat-menu>

  <!-- Developer Menu -->
  <button mat-button [matMenuTriggerFor]="devMenu">Developer</button>
  <mat-menu #devMenu="matMenu">
    <button mat-menu-item (click)="login('developer')">Login</button>
    <button mat-menu-item (click)="register('developer')">Register</button>
  </mat-menu>
</mat-toolbar>

<!-- Hero Section -->
<div class="hero-section">
  <div class="hero-content">
    <h1>Welcome to AppVerse 🚀</h1>
    <p>Your one-stop platform to discover, upload, and manage apps.</p>
    <div class="cta-buttons">
      <button mat-raised-button color="primary" (click)="login('user')">Get Started</button>
      <button mat-button color="accent" routerLink="/about">Learn More</button>
    </div>
  </div>
  <img src="https://cdni.iconscout.com/illustration/premium/thumb/app-development-4449843-3705741.png" alt="AppVerse" />
</div>
