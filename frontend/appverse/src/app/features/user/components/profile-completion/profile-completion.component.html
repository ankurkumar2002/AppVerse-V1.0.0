<div class="max-w-md mx-auto bg-gray-900 text-white shadow-lg p-6 rounded-lg">
  <h2 class="text-2xl font-semibold mb-4">Complete Your Profile</h2>

  <form [formGroup]="profileForm" (ngSubmit)="submitProfile()">
    <!-- Hidden fields from Keycloak -->
    <input type="hidden" formControlName="username" />
    <input type="hidden" formControlName="email" />
    <input type="hidden" formControlName="firstName" />
    <input type="hidden" formControlName="lastName" />
    <input type="hidden" formControlName="keycloakUserId" />

    <!-- Phone number (only visible field) -->
    <div class="mb-3">
      <label class="block mb-1">Phone Number</label>
      <input formControlName="phoneNumber" type="tel" placeholder="Enter your phone number"
        class="w-full border border-gray-700 bg-gray-800 text-white p-2 rounded" />
    </div>

    <button type="submit" [disabled]="loading || profileForm.invalid"
      class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
      {{ loading ? 'Saving...' : 'Save Profile' }}
    </button>
  </form>
</div>
