<div class="application-container">
  <!-- We removed the mat-card and are using a simpler container -->
  <div class="table-container">
    
    <!-- This is a custom header to replace <mat-card-header> -->
    <div class="table-header">
      <h2 class="table-title">My Apps</h2>
      <span class="spacer"></span>
      <button mat-raised-button color="primary" routerLink="/developer/apps/create">
        <mat-icon>add</mat-icon>
        <span>Create App</span>
      </button>
    </div>

    @if (isLoading) {
      <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
    }

    <!-- The mat-card-content wrapper is no longer needed -->
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z0">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> App Name </th>
          <td mat-cell *matCellDef="let app"> {{app.name}} </td>
        </ng-container>

        <!-- Tagline Column -->
        <ng-container matColumnDef="tagline">
          <th mat-header-cell *matHeaderCellDef> Tagline </th>
          <td mat-cell *matCellDef="let app" class="tagline-cell"> {{app.tagline}} </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let app">
            
            <!--
              ✅ FIX APPLIED HERE
              This @if block checks if 'app.status' exists before trying to use it.
              This prevents the rendering crash, allowing the table and paginator to display correctly.
            -->
            @if (app.status) {
              <span class="status-badge" [ngClass]="'status-' + app.status.toLowerCase()">
                {{ app.status }}
              </span>
              <button class="status-badge" [ngClass]="'status-' + app.status.toLowerCase()" type="submit">{{app.status}}</button>
            } @else {
              <!-- This block will be displayed as a fallback if app.status is null -->
              <span class="status-badge status-unknown">
                Unknown
              </span>
            }

          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let app" class="actions-cell">
            <button mat-icon-button class="view-button" [routerLink]="['/developer/apps', app.id]" matTooltip="View Details">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button class="edit-button" [routerLink]="['/developer/apps', app.id, 'edit']" matTooltip="Edit App">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button class="delete-button" matTooltip="Delete App" (click)="deleteApplication(app.id)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </div>
    
    @if (!isLoading && dataSource.data.length === 0) {
      <div class="empty-state">
        <mat-icon>apps</mat-icon>
        <span>No applications have been created yet.</span>
        <button mat-stroked-button color="primary" (click)="openCreateDialog()" class="empty-state-button">
          Create Your First App
        </button>
      </div>
    }

    <mat-paginator [pageSizeOptions]="[5, 10, 25]"
                    showFirstLastButtons
                    aria-label="Select page of applications">
    </mat-paginator>
      
  </div>
</div>
