<div class="update-container">
  <div *ngIf="isLoading" class="loading-state">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Loading Application Data...</p>
  </div>

  <div *ngIf="errorMessage" class="error-banner">
    <p>{{ errorMessage }}</p>
  </div>

  <form [formGroup]="updateForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading" novalidate>
    <header class="form-header">
      <h1>Update Application</h1>
      <p>Editing: <strong>{{ originalApplicationData?.name }}</strong></p>
    </header>

    <!-- General Information Section -->
    <section class="form-section">
      <div class="mb-4">
        <label for="name" class="form-label">Application Name</label>
        <input type="text" id="name" class="form-control" formControlName="name">
        <div *ngIf="updateForm.get('name')?.invalid && updateForm.get('name')?.touched" class="validation-error">
          Name is required.
        </div>
      </div>

      <div class="mb-4">
        <label for="tagline" class="form-label">Tagline</label>
        <input type="text" id="tagline" class="form-control" formControlName="tagline">
      </div>

      <div class="mb-4">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" class="form-control" formControlName="description" rows="5"></textarea>
      </div>

       <div class="row">
        <div class="col-md-6 mb-4">
            <label for="version" class="form-label">Version</label>
            <input type="text" id="version" class="form-control" formControlName="version">
        </div>
        <div class="col-md-6 mb-4">
            <label for="categoryId" class="form-label">Category ID</label>
            <input type="text" id="categoryId" class="form-control" formControlName="categoryId">
        </div>
      </div>
    </section>

    <!-- Image Upload Section -->
    <section class="form-section">
      <h2>Media Assets</h2>
      <p class="section-description">Uploading new files below will replace all existing ones.</p>

      <!-- Thumbnail -->
      <div class="mb-5">
        <label for="thumbnail" class="form-label">Thumbnail Image</label>
        <div class="image-preview mb-3" *ngIf="thumbnailPreviewUrl">
          <img [src]="thumbnailPreviewUrl" alt="Thumbnail Preview">
        </div>
        <input type="file" id="thumbnail" class="form-control" (change)="onThumbnailSelect($event)" accept="image/png, image/jpeg, image/webp">
      </div>

      <!-- Screenshots -->
      <div>
        <label for="screenshots" class="form-label">Screenshots</label>
         <div class="screenshots-grid mb-3" *ngIf="screenshotPreviewUrls.length > 0">
            <div *ngFor="let url of screenshotPreviewUrls" class="image-preview">
                <img [src]="url" alt="Screenshot Preview">
            </div>
        </div>
        <input type="file" id="screenshots" class="form-control" (change)="onScreenshotsSelect($event)" accept="image/png, image/jpeg, image/webp" multiple>
      </div>
    </section>

    <!-- Submission Area -->
    <footer class="form-footer">
        <button type="submit" class="submit-btn" [disabled]="isSubmitting">
            <span *ngIf="!isSubmitting">Save Changes</span>
            <mat-spinner *ngIf="isSubmitting" diameter="20" class="spinner-small"></mat-spinner>
        </button>
        <button type="button" class="cancel-btn" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
    </footer>
  </form>
</div>
