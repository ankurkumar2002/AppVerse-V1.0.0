spring.application.name=developer-service
spring.datasource.url=jdbc:mysql://localhost:3307/developer_service
spring.datasource.username=root
spring.datasource.password=ankur
spring.jpa.hibernate.ddl-auto=none
server.port=8081
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/appverse




springdoc.swagger-ui.path=/swagger-ui.html

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# logging.level.com.appverse.developer_service=DEBUG
