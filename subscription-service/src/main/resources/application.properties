spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ... your existing properties ...

# Enable DEBUG logging for Spring Kafka components
logging.level.org.springframework.kafka=DEBUG

# Enable DEBUG logging for Apache Kafka client components (producer, consumer, network, etc.)
logging.level.org.apache.kafka.clients=DEBUG
# You can get even more specific if needed:
# logging.level.org.apache.kafka.clients.producer.KafkaProducer=DEBUG
# logging.level.org.apache.kafka.common.network=DEBUG # For network I/O details
# logging.level.org.apache.kafka.common.utils.AppInfoParser=INFO # This one is often noisy at DEBUG

# Ensure your application's specific Kafka publishing logic is also at DEBUG
logging.level.com.appverse.subscription_service.services.serviceImpl.SubscriptionServiceImpl=DEBUG 
# Or more broadly:
# logging.level.com.appverse.subscription_service=DEBUG

# Keep these for good error reporting in responses (though not directly for Kafka client logs)
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-message=always

logging.level.com.appverse.subscription_service=DEBUG
# logging.level.org.springframework.kafka=DEBUG
# logging.level.org.apache.kafka.clients=DEBUG

# management.endpoints.web.exposure.include=health, info, metrics, prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=subscription-service

management.tracing.sampling.probability=1.0

management.observations.key-values.application=${spring.application.name}